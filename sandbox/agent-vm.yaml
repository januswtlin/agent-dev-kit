# Lima template for the agent sandbox VM (fallback when Docker Sandboxes is not used).
#
#   limactl start --name agent sandbox/agent-vm.yaml --set '.mounts[0].location="'"$PWD"'"'
#
# or simply: sandbox/vm.sh up
#
# What makes this a boundary:
#   - a full virtual machine with its own kernel (Apple Virtualization framework)
#   - ONE mount: the project worktree. The host home directory is not mounted.
#   - outbound traffic limited to sandbox/allowlist.txt by sandbox/egress.sh
#
# NOT YET TESTED on a Mac. Run docs/redteam-machine.md after first setup.

vmType: vz
arch: aarch64
cpus: 4
memory: 6GiB
disk: 40GiB

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64

# The only path shared with the host. `vm.sh` replaces the location with the worktree.
mounts:
  - location: "/tmp/replace-with-project-worktree"
    mountPoint: "/workspace"
    writable: true

mountType: virtiofs

# No SSH agent forwarding, no host credentials, no host port forwards.
ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false

portForwards:
  - guestPortRange: [1, 65535]
    hostIP: "127.0.0.1"
    ignore: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends git make curl ca-certificates python3 python3-venv jq iptables ipset dnsutils gh nodejs npm
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      mkdir -p "$HOME/.npm-global" && npm config set prefix "$HOME/.npm-global"
      grep -q npm-global "$HOME/.profile" || echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> "$HOME/.profile"
      export PATH="$HOME/.npm-global/bin:$PATH"
      npm install -g @anthropic-ai/claude-code @openai/codex
