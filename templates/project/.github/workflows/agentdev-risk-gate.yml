name: agentdev-risk-gate

# Calls the kit's reusable workflow at the version agentdev.toml pins. Generated by
# `agentctl init`; to move to another kit version, change the SHA here (twice) and
# in agentdev.toml together. `agentctl pins` fails when they differ.
# Required check: "risk-gate / risk-gate".

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  risk-gate:
    uses: __KIT_REPOSITORY__/.github/workflows/risk-gate.yml@__KIT_VERSION__
    with:
      kit_version: __KIT_VERSION__
