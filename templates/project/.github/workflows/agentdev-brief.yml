name: agentdev-brief

# Calls the kit's reusable workflow at the version agentdev.toml pins. Generated by
# `agentctl init`; to move to another kit version, change the SHA here (twice) and
# in agentdev.toml together. `agentctl pins` fails when they differ.

on:
  schedule:
    - cron: "43 23 * * *"   # daily
    - cron: "7 1 * * 1"     # weekly digest, Monday
  workflow_dispatch:
    inputs:
      weekly:
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  brief:
    uses: __KIT_REPOSITORY__/.github/workflows/brief.yml@__KIT_VERSION__
    secrets: inherit
    with:
      kit_version: __KIT_VERSION__
      weekly: ${{ github.event.schedule == '7 1 * * 1' || inputs.weekly == true }}
