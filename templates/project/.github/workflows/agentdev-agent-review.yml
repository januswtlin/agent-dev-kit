name: agentdev-agent-review

# Calls the kit's reusable workflow at the version agentdev.toml pins. Generated by
# `agentctl init`; to move to another kit version, change the SHA here (twice) and
# in agentdev.toml together. `agentctl pins` fails when they differ.
# Started by the conductor (workflow_dispatch) for one commit of a story's pull
# request, and run on submitted reviews to bridge a review bot's verdict. Sets the
# required commit status "agent-review". The review token is a secret of the
# `conductor` environment, which only the default branch may use.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      story:
        description: Story id
        required: true
      developer:
        description: Whose subscription runs the review (login in upper case, as used in secret names)
        required: false
        default: ""
      sha:
        description: The commit to review
        required: false
        default: ""
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  agent-review:
    uses: __KIT_REPOSITORY__/.github/workflows/agent-review.yml@__KIT_VERSION__
    secrets: inherit
    with:
      kit_version: __KIT_VERSION__
      pr: ${{ inputs.pr || '' }}
      story: ${{ inputs.story || '' }}
      developer: ${{ inputs.developer || '' }}
      sha: ${{ inputs.sha || '' }}
