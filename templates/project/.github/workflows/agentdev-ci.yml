name: agentdev-ci

# Calls the kit's reusable workflow at the version agentdev.toml pins. Generated by
# `agentctl init`; to move to another kit version, change the SHA here (twice) and
# in agentdev.toml together. `agentctl pins` fails when they differ.
# Required checks: "ci / ci" and "ci / spec-verify".

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: agentdev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: __KIT_REPOSITORY__/.github/workflows/ci.yml@__KIT_VERSION__
    with:
      kit_version: __KIT_VERSION__
