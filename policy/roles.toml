# Who does what. Read by `agentctl reconcile`.
#
# The pipeline does not assume a team shape. It works for one person with one AI
# subscription, one person with several, or several people who each bring their
# own. Describe yours here; `scripts/init.sh` fills in the logins.
#
# Rules that hold for every shape:
#   - a developer's stories run on that developer's own subscriptions. Whose story
#     it is comes from the sprint file (`assignee`, and `[owners]` for exceptions)
#   - for every stage, harnesses are tried in order; one whose quota is exhausted
#     is skipped until its window resets
#   - the reviewer differs from the implementer whenever the list allows it

# GitHub logins of the people who may approve product decisions: specs, sprints,
# product documents. Usually one person. Keep in sync with .github/CODEOWNERS.
directors = ["DIRECTOR_LOGIN"]

# Everyone whose approval counts for a T2 change and who is asked when a story
# needs a decision. Directors are included.
humans = ["DIRECTOR_LOGIN"]

# Harness that drafts specs and sprints when no developer is implied.
planner = "claude"

# --- How each harness is started -----------------------------------------------------
# via = "http"     POST to a cloud scheduled task's API trigger (laptop can be closed)
# via = "comment"  post a mention that starts a cloud task (laptop can be closed)
# via = "sbx"      start a clone-mode Docker Sandbox on the developer's Mac. Needs
#                  `agentctl conductor here` running on that Mac; while the
#                  conductor is on GitHub Actions these stages simply wait
# via = "workflow" run .github/workflows/agent-job.yml on a self-hosted runner in the
#                  developer's Lima VM. NOT part of the supported setup: that VM is
#                  long-lived and shared between stages (sandbox/runner/README.md)
#
# Credentials are per developer: the conductor looks for NAME_<LOGIN> first (login
# in upper case, other characters as "_"), then NAME.
# Which cloud paths work with your accounts is settled by the spike in
# docs/new-project.md. Switch a harness to via = "sbx" if its cloud path does not.

[harness.claude]
# Reviews run as a workflow job so the job itself sets the agent-review status.
review_workflow = "agent-review.yml"
via = "http"
url_env = "CLAUDE_TRIGGER_URL"
token_env = "CLAUDE_TRIGGER_TOKEN"

[harness.codex]
via = "comment"
mention = "@codex"
token_env = "DISPATCH_TOKEN"

[harness.ollama]
via = "sbx"

# What a stage's sandbox is given (how much its GitHub token may do, which hosts
# it may reach, which deny rules apply) is not configured here. It is fixed in
# tools/agentctl/profiles.py, so that a branch cannot widen its own privileges.

# --- Developers ----------------------------------------------------------------------
# One table per person, keyed by GitHub login. `default` covers a story with no
# assignee and anyone not listed. Pick the example that matches each person and
# adjust. Implementation is the most token-hungry stage; review is the lightest.

# Example A: two vendors. Cross-vendor review. Put implementation on the larger
# subscription and review on the smaller one.
[developers.default.stages]
design = ["claude"]
tests = ["claude"]
impl = ["claude", "codex"]
review = ["codex", "claude"]
triage = ["claude"]

# Example B: one vendor only. Every stage is a separate, fresh session of the same
# harness. There is no cross-vendor review, so the mechanical gates carry the
# main guarantee and T2 changes still go to a human.
#
# [developers.SOME_LOGIN.stages]
# design = ["codex"]
# tests = ["codex"]
# impl = ["codex"]
# review = ["codex"]
# triage = ["codex"]

# Example C: add a local model for the cheap stages (needs the self-hosted runner).
#
# [developers.SOME_LOGIN.stages]
# design = ["claude"]
# tests = ["claude"]
# impl = ["claude", "codex"]
# review = ["codex", "claude"]
# triage = ["ollama", "claude"]
