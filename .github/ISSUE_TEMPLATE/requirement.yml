name: Requirement
description: A one-line requirement. The product owner agent turns it into a story for approval.
title: "Requirement: "
labels: ["requirement"]
body:
  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: One or two sentences on what a user should be able to do. The PO agent asks about the details.
      placeholder: A customer can pay by bank transfer and attach proof of the transfer; the shop owner reviews the proof and passes it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Constraints already decided, what is out of scope, related existing features.
