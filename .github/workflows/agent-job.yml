name: agent-job

# Runs one pipeline stage on a self-hosted runner that lives INSIDE the sandbox VM
# on a developer's Mac (see sandbox/runner/). Jobs queue on GitHub and are picked
# up whenever that machine is online; nobody has to start them by hand.
#
# This is the supplementary path. Cloud sessions are the primary one, because
# they keep working with the laptop closed. Ollama stages always come here.
#
# Each developer registers the runner in their own VM with the labels
# `agent-sandbox` and their GitHub login, so a story runs on its assignee's
# machine and subscription. The runner is logged in to Claude Code and Codex, and
# acts on GitHub as that developer's agent GitHub App (no workflow, admin or
# status permission); see docs/runbook.md.

on:
  workflow_dispatch:
    inputs:
      story:
        required: true
      stage:
        required: true
      harness:
        description: claude | codex | ollama
        required: true
      prompt:
        required: true
      developer:
        description: GitHub login of the developer whose runner and subscription to use
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: agent-job-${{ inputs.story }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ fromJSON(inputs.developer != '' && format('["self-hosted","agent-sandbox","{0}"]', inputs.developer) || '["self-hosted","agent-sandbox"]') }}
    timeout-minutes: 120
    env:
      PROMPT: ${{ inputs.prompt }}
      HARNESS: ${{ inputs.harness }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'devstral' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes use the agent App's own credentials (configured in the VM), not the job token.
          persist-credentials: false
      - name: Refuse to run outside the sandbox
        run: bin/agentctl doctor --inside
      - name: Run the stage
        run: |
          GH_TOKEN="$(bin/agentctl app-token)"; export GH_TOKEN
          case "$HARNESS" in
            claude) claude -p "$PROMPT" --permission-mode bypassPermissions ;;
            codex)  codex exec --sandbox danger-full-access "$PROMPT" ;;
            ollama) codex exec --oss --model "$OLLAMA_MODEL" --sandbox danger-full-access "$PROMPT" ;;
            *) echo "unknown harness $HARNESS"; exit 1 ;;
          esac
