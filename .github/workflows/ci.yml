name: ci

# Mechanical gates. Job names are required status checks in the ruleset: ci, spec-verify.
#
# Minutes matter (every job is billed rounded up to a whole minute), so:
#   - a draft pull request only gets lint; the full run happens when it is marked ready
#   - the test suite runs once on head, plus once on base for a story branch, in ONE job
#   - judging happens in a second, tiny job that executes no pull request code
#
# `ci` runs pull request code with a read-only token and no secrets. It may move
# to the self-hosted runner in the sandbox VM when the monthly allowance runs low
# (vars.CI_RUNNER, set by `agentctl budget`). `spec-verify` never moves: a machine
# that ran the pull request's code must not be the one that judges it.

on:
  pull_request:
    # Only pull requests into the default branch are judged. A status earned against
    # some other base must not exist on a commit that later targets main.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    env:
      FULL: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - name: Both language versions of a story change together
        if: github.event_name == 'pull_request'
        run: bin/agentctl spec-lint --base "origin/$BASE_REF"

      - name: Tests on head
        id: tests
        if: env.FULL == 'true'
        continue-on-error: true
        run: make test
      - name: Tests on base with this branch's test files (story branches)
        if: env.FULL == 'true' && github.event_name == 'pull_request'
        run: bin/agentctl redgreen-collect --base "origin/$BASE_REF" --out reports/base-overlay --branch "$HEAD_REF"
      - name: Always leave a result file, so a missing artifact means a broken run
        if: env.FULL == 'true'
        run: |
          mkdir -p reports/junit
          [ -n "$(ls -A reports/junit)" ] || echo '<testsuites/>' > reports/junit/none.xml
      - uses: actions/upload-artifact@v4
        if: env.FULL == 'true'
        with:
          name: junit
          path: reports/
          retention-days: 90
      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  spec-verify:
    # Traceability and red-green, judged from the result files with the tooling and
    # policy of the base branch. Nothing from the pull request is executed here.
    needs: ci
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: junit
          path: head/reports
      - name: Results of the last green run on the base branch
        if: github.event_name == 'pull_request'
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_REF" --event push \
            --limit 30 --json databaseId,conclusion,status)"
          run_id="$(printf '%s' "$runs" | python3 -I -c 'import json,sys; r=[x for x in json.load(sys.stdin) if x["conclusion"]=="success"]; print(r[0]["databaseId"] if r else "")')"
          total="$(printf '%s' "$runs" | python3 -I -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n junit -D main-reports
          elif [ "$total" = "0" ]; then
            echo "::warning::$BASE_REF has never run ci; nothing to compare against yet"
          else
            echo "::error::$BASE_REF has ci runs but none of the last $total is green; fix $BASE_REF first"
            exit 1
          fi
      # The judge is the base branch's copy, started with -I: `python3 -m` would put the
      # working directory (the pull request's tree) first on the import path.
      - name: Traceability
        working-directory: head
        env:
          AGENTCTL_TRUSTED_ROOT: ${{ github.workspace }}/base
        run: |
          set -- --junit 'reports/junit/*.xml'
          [ -d ../main-reports ] && set -- "$@" --base-junit '../main-reports/junit/*.xml'
          [ -n "$HEAD_REF" ] && set -- "$@" --branch "$HEAD_REF"
          python3 -I "$GITHUB_WORKSPACE/base/tools/run.py" trace "$@"
      - name: Red-green
        if: github.event_name == 'pull_request'
        working-directory: head
        env:
          AGENTCTL_TRUSTED_ROOT: ${{ github.workspace }}/base
        run: python3 -I "$GITHUB_WORKSPACE/base/tools/run.py" redgreen-judge --base-dir reports/base-overlay --junit 'reports/junit/*.xml' --branch "$HEAD_REF"
