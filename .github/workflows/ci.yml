name: ci

# Mechanical gates. Job names are required status checks in the ruleset: ci, spec-verify.
#
# Minutes matter (every job is billed rounded up to a whole minute), so:
#   - a draft pull request only gets lint; the full run happens when it is marked ready
#   - the test suite runs once on head, plus once on base for a story branch, in ONE job
#   - judging happens in a second, tiny job that executes no pull request code
#
# `ci` runs pull request code with a read-only token and no secrets. Its runner
# comes from vars.CI_RUNNER, which `agentctl budget` changes only when an overflow
# runner is configured in policy/conductor.toml; none is by default, because the
# runner must be dedicated, hold no credentials and be recreated for every job.
# `spec-verify` never moves: a machine that ran the pull request's code must not
# be the one that judges it.

on:
  pull_request:
    # Only pull requests into the default branch are judged. A status earned against
    # some other base must not exist on a commit that later targets main.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    env:
      FULL: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - name: Both language versions of a story change together
        if: github.event_name == 'pull_request'
        run: bin/agentctl spec-lint --base "origin/$BASE_REF"

      - name: Tests on head
        id: tests
        if: env.FULL == 'true'
        continue-on-error: true
        run: make test
      - name: Tests on base with this branch's test files (story branches)
        if: env.FULL == 'true' && github.event_name == 'pull_request'
        run: bin/agentctl redgreen-collect --base "origin/$BASE_REF" --out reports/base-overlay --branch "$HEAD_REF"
      - name: Always leave a result file, so a missing artifact means a broken run
        if: env.FULL == 'true'
        run: |
          mkdir -p reports/junit
          [ -n "$(ls -A reports/junit)" ] || echo '<testsuites/>' > reports/junit/none.xml
      - uses: actions/upload-artifact@v4
        if: env.FULL == 'true'
        with:
          name: junit
          path: reports/
          retention-days: 90
      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  spec-verify:
    # Traceability and red-green, judged from the result files with the tooling and
    # policy of the base branch. Nothing from the pull request is executed here.
    #
    # The result files were produced by a job that ran the pull request's code, so
    # they are untrusted input. The order of the steps is part of the defence:
    #   1. the artifact is unpacked in the runner's temp directory, outside both checkouts
    #   2. only plain *.xml files and collected.json are copied on; a symbolic link fails the job
    #   3. the pull request's tree is checked out (for its specs), then the base branch
    #      LAST, into a directory nothing earlier could have prepared
    needs: ci
    if: always() && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: junit
          path: ${{ runner.temp }}/artifact
      - name: Results of the newest runs on the base branch that have any
        if: github.event_name == 'pull_request'
        run: |
          # Up to five runs, whatever they concluded: a test case that passed in any of
          # them must still pass. Insisting on a green run would make a red main
          # impossible to repair; taking only the newest would let one partial run on
          # main make older coverage forgettable.
          # "No results" has to be told apart from "could not find out": an artifact
          # that is absent or expired is skipped, a failed listing or download is an error.
          ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_REF" --event push \
            --status completed --limit 30 --json databaseId --jq '.[].databaseId')"
          found=0
          for id in $ids; do
            [ "$found" -lt 5 ] || break
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
              --jq '[.artifacts[] | select(.name == "junit")] | if length == 0 then "none" elif .[0].expired then "expired" else "present" end')" \
              || { echo "::error::cannot list the artifacts of run $id on $BASE_REF"; exit 1; }
            [ "$state" = "present" ] || continue
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n junit -D "$RUNNER_TEMP/main-artifact/$id" \
              || { echo "::error::run $id on $BASE_REF has results but they could not be downloaded"; exit 1; }
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::no ci run on $BASE_REF has results (a new project, or they expired); nothing to compare against"
          else
            echo "comparing against $found run(s) on $BASE_REF"
          fi
      - name: Keep only plain result files
        run: |
          RESULTS="$RUNNER_TEMP/results"
          rm -rf "$RESULTS"; mkdir -p "$RESULTS/junit" "$RESULTS/base-overlay" "$RESULTS/main"
          keep() {  # keep SOURCE_DIR DESTINATION_DIR
            [ -d "$1" ] || return 0
            if [ -n "$(find "$1" -type l -print -quit)" ]; then echo "::error::$1 contains a symbolic link"; exit 1; fi
            find "$1" -maxdepth 1 -type f \( -name '*.xml' -o -name 'collected.json' \) -exec cp -- {} "$2/" \;
          }
          keep "$RUNNER_TEMP/artifact/junit" "$RESULTS/junit"
          keep "$RUNNER_TEMP/artifact/base-overlay" "$RESULTS/base-overlay"
          for run in "$RUNNER_TEMP"/main-artifact/*/; do
            [ -d "$run" ] || continue
            mkdir -p "$RESULTS/main/$(basename "$run")"
            keep "${run}junit" "$RESULTS/main/$(basename "$run")"
          done
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The judge is the base branch's copy, started with -I: `python3 -m` would put the
      # working directory (the pull request's tree) first on the import path.
      - name: Traceability
        working-directory: head
        env:
          AGENTCTL_TRUSTED_ROOT: ${{ github.workspace }}/base
        run: |
          RESULTS="$RUNNER_TEMP/results"
          set -- --junit "$RESULTS/junit/*.xml"
          [ -n "$(ls -A "$RESULTS/main")" ] && set -- "$@" --base-junit "$RESULTS/main/*/*.xml"
          [ -n "$HEAD_REF" ] && set -- "$@" --branch "$HEAD_REF"
          python3 -I "$GITHUB_WORKSPACE/base/tools/run.py" trace "$@"
      - name: Red-green
        if: github.event_name == 'pull_request'
        working-directory: head
        env:
          AGENTCTL_TRUSTED_ROOT: ${{ github.workspace }}/base
        run: python3 -I "$GITHUB_WORKSPACE/base/tools/run.py" redgreen-judge --base-dir "$RUNNER_TEMP/results/base-overlay" --junit "$RUNNER_TEMP/results/junit/*.xml" --branch "$HEAD_REF"
