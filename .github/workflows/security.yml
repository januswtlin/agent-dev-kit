name: security

# Reusable: called from a project's .github/workflows/agentdev-security.yml on pull
# requests into the default branch and on pushes to it. Required status check
# "security / security". Skipped on draft pull requests.
# New or changed dependencies are not judged here; they are routed to a human by
# the risk gate ([risk.t2] dependency_manifests in agentdev.toml).

on:
  workflow_call:
    inputs:
      kit_version:
        type: string
        required: true
      kit_repository:
        type: string
        default: januswtlin/agent-dev-kit

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  security:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: |
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=x64 ;; esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          if [ -n "$BASE_REF" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --log-opts="origin/${BASE_REF}..HEAD" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --log-opts="-1" .
          fi

      - name: Is there code to analyse?
        id: code
        run: |
          if [ -n "$BASE_REF" ]; then range="origin/${BASE_REF}...HEAD"; else range="HEAD~1..HEAD"; fi
          if git diff --name-only "$range" | grep -Evq '(^docs/|\.md$|\.toml$|\.txt$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Static analysis (semgrep)
        if: steps.code.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep" && "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config auto --error --quiet
