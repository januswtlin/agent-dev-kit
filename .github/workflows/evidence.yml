name: evidence

# After a story merges, post the AC -> TC -> test -> result table on the story
# issue. This is what the director reads instead of the code.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  evidence:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'story/')
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Reuse the results of the pull request's last green ci run instead of running the suite again.
      - name: Fetch test results
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id="$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] && gh run download "$run_id" -n junit -D reports
      - name: Post the evidence table
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          story="$(printf '%s' "$HEAD_REF" | sed -E 's#^story/([0-9]{3}).*#\1#')"
          bin/agentctl evidence "$story" --junit 'reports/junit/*.xml' > evidence.md
          echo "" >> evidence.md
          echo "Merged in #$PR." >> evidence.md
          issue="$(gh issue list --label "story:$story" --state all --limit 1 --json number --jq '.[0].number')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file evidence.md
            gh label create "stage:merged" --force >/dev/null 2>&1 || true
            gh issue edit "$issue" --add-label "stage:merged"
          else
            cat evidence.md >> "$GITHUB_STEP_SUMMARY"
          fi
