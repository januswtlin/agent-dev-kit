name: notify

# Tells the conductor that an agent pushed a branch. It does nothing itself and
# holds no secrets and no write permission.
#
# Why it exists: a workflow started by a push to a branch runs the workflow file
# as it is ON THAT BRANCH, so nothing that handles credentials may be triggered
# that way. The conductor instead listens for this workflow's completion
# (`workflow_run`), which always runs the conductor from the default branch.

on:
  push:
    branches: ["story/**", "spec/**", "sprint/**", "chore/**"]

permissions: {}

jobs:
  notify:
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "branch pushed; the conductor will pick it up"
