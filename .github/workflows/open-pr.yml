name: open-pr

# Agents push branches; they never open pull requests. The conductor GitHub App
# opens them, for two reasons:
#   1. GitHub does not let an author approve their own pull request. If a cloud
#      agent acting as you opened the spec PR, you could not approve it.
#   2. Pull requests opened with the default GITHUB_TOKEN do not trigger other
#      workflows, so the gates would never run.

on:
  push:
    branches: ["story/**", "spec/**", "sprint/**", "chore/**"]

permissions:
  contents: read

jobs:
  open-pr:
    # Skipped until the conductor GitHub App is configured (docs/new-project.md, section 3).
    if: vars.CONDUCTOR_APP_ID != ''
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.CONDUCTOR_APP_ID }}
          private-key: ${{ secrets.CONDUCTOR_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: Open a pull request if none exists
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "pull request already open"; exit 0
          fi
          title="$(git log -1 --pretty=%s)"
          # Story branches open as drafts: a draft only gets lint, and the conductor
          # marks it ready once the implementation stage is done. Everything else
          # (specs, sprints, chores) is ready for review at once.
          draft=""
          case "$BRANCH" in story/*) draft="--draft" ;; esac
          gh pr create $draft --head "$BRANCH" --base main --title "$title" \
            --body "Opened by the conductor for branch \`$BRANCH\`. See the linked story issue for context."
