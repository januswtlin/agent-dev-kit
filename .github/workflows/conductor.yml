name: conductor

# The reconciler on GitHub Actions. Stateless: every run observes GitHub and
# does whatever should happen next, including opening pull requests for pushed
# branches.
#
# This job holds the pipeline's credentials, so two things are arranged so that
# only the default branch's version of it can ever get them:
#   - every trigger below runs the workflow file from the default branch
#     (schedule, workflow_run, pull_request_target, issues, push to main), except
#     workflow_dispatch, where the caller picks the ref
#   - the credentials are secrets of the `conductor` ENVIRONMENT, whose deployment
#     branch rule allows the default branch only. A run from any other ref, a
#     manual dispatch included, is refused the secrets by GitHub itself.
# There is deliberately no `pull_request` or `push`-to-branch trigger here: those
# run the workflow file as it exists on the branch.
#
# The same program can run in a terminal instead (`agentctl conductor here`),
# which costs no Actions minutes. While a local conductor holds the lease
# (vars.CONDUCTOR_HOME == 'local'), event-triggered runs here are skipped; the
# scheduled run still starts, and takes over if the lease has gone stale.
#
# Every run is billed as at least one minute, so the schedule is deliberately sparse.
#
# Kill switch: set the repository variable CONDUCTOR_PAUSED to true.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the actions without executing them (creates nothing)
        type: boolean
        default: false
  workflow_run:
    # `notify` fires when an agent pushes a branch; `risk-gate` re-runs on reviews;
    # `agent-review` ends when a review verdict has been published.
    workflows: [ci, risk-gate, notify, agent-review]
    types: [completed]
  pull_request_target:
    types: [closed]
  issues:
    types: [labeled, unlabeled]
  push:
    branches: [main]
    paths: ["docs/sprints/**", "docs/product/roadmap.md"]

permissions:
  contents: read

concurrency:
  group: conductor
  cancel-in-progress: false

jobs:
  reconcile:
    # Skipped until the conductor GitHub App is configured (docs/new-project.md, section 3).
    if: >-
      vars.CONDUCTOR_APP_ID != '' &&
      (vars.CONDUCTOR_HOME != 'local' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: conductor
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.CONDUCTOR_APP_ID }}
          private-key: ${{ secrets.CONDUCTOR_APP_PRIVATE_KEY }}
      # Always the default branch: the conductor never runs code from a pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # The conductor's own login, so that only its marker comments are believed.
          CONDUCTOR_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          # Dispatch credentials are per developer (CLAUDE_TRIGGER_URL_<LOGIN>, ...), so
          # the whole secrets context of the environment is handed over.
          CONDUCTOR_SECRETS: ${{ toJSON(secrets) }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then bin/agentctl reconcile --respect-lease --dry-run; else bin/agentctl reconcile --respect-lease; fi
      - name: Actions budget (scheduled runs)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/agentctl budget
