name: conductor

# The reconciler on GitHub Actions. Stateless: every run observes GitHub and
# dispatches whatever should happen next.
#
# The same program can run in a terminal instead (`agentctl conductor here`),
# which costs no Actions minutes. While a local conductor holds the lease
# (vars.CONDUCTOR_HOME == 'local'), event-triggered runs here are skipped; the
# scheduled run still starts, and takes over if the lease has gone stale, for
# example because the laptop was closed without `agentctl conductor away`.
#
# Events drive it; the schedule only catches stalls and missed events. Every run
# is billed as at least one minute, so the schedule is deliberately sparse.
#
# Kill switch: set the repository variable CONDUCTOR_PAUSED to true.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the actions without executing them
        type: boolean
        default: false
  pull_request:
    types: [closed, labeled]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/sprints/**", "docs/product/roadmap.md"]

permissions:
  contents: read

concurrency:
  group: conductor
  cancel-in-progress: false

jobs:
  reconcile:
    # Skipped until the conductor GitHub App is configured (docs/runbook.md, section 2.2).
    if: >-
      vars.CONDUCTOR_APP_ID != '' &&
      (vars.CONDUCTOR_HOME != 'local' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.CONDUCTOR_APP_ID }}
          private-key: ${{ secrets.CONDUCTOR_APP_PRIVATE_KEY }}
      # Always the default branch: the conductor never runs code from a pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CONDUCTOR_PAUSED: ${{ vars.CONDUCTOR_PAUSED }}
          CONDUCTOR_HOME: ${{ vars.CONDUCTOR_HOME }}
          CONDUCTOR_LEASE: ${{ vars.CONDUCTOR_LEASE }}
          CONDUCTOR_QUOTA: ${{ vars.CONDUCTOR_QUOTA }}
          CLAUDE_TRIGGER_URL: ${{ secrets.CLAUDE_TRIGGER_URL }}
          CLAUDE_TRIGGER_TOKEN: ${{ secrets.CLAUDE_TRIGGER_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then bin/agentctl reconcile --respect-lease --dry-run; else bin/agentctl reconcile --respect-lease; fi
      - name: Actions budget (scheduled runs)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/agentctl budget
